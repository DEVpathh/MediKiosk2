services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: medikiosk
      POSTGRES_USER: medikiosk
      POSTGRES_PASSWORD: medikiosk
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data","./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro"]
volumes:
  pgdata:
